spring.application.name=alert-service
server.port=8082

# ---- JDBC connection used by DriverManager (same MySQL database as report-service) ----
floodwatch.db.driver=com.mysql.cj.jdbc.Driver
floodwatch.db.url=jdbc:mysql://localhost:3306/floodwatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
floodwatch.db.user=${DB_USER:root}
floodwatch.db.password=${DB_PASSWORD}

# Must match report-service: a confirmed report needs this many CONFIRM votes
floodwatch.confirm-threshold=3
