services:
  mysql:
    image: mysql:8.4
    # Keep the classroom demo within a 500 MB database container.
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-chunk-size=64M
      - --innodb-log-buffer-size=16M
      - --max-connections=40
      - --table-open-cache=256
      - --table-definition-cache=400
      - --thread-cache-size=4
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --temptable-max-ram=32M
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: floodwatch
      MYSQL_USER: floodwatch
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your terminal}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate DB_ROOT_PASSWORD in your terminal}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u floodwatch -D floodwatch -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  report-service:
    build: ./report-service
    environment:
      DB_HOST: mysql
      DB_NAME: floodwatch
      DB_USER: floodwatch
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your terminal}
      ALERT_SERVICE_URL: http://alert-service:8080
    depends_on:
      mysql:
        condition: service_healthy
  alert-service:
    build: ./alert-service
    environment:
      DB_HOST: mysql
      DB_NAME: floodwatch
      DB_USER: floodwatch
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your terminal}
    depends_on:
      report-service:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      REPORT_SERVICE_URL: http://report-service:8080
      ALERT_SERVICE_URL: http://alert-service:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      report-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
volumes:
  mysql-data:
