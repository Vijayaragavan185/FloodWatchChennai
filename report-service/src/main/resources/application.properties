spring.application.name=report-service
server.port=8081

# ---- MySQL 8.0.31+ (the floodwatch database is created automatically on first start) ----
spring.datasource.url=jdbc:mysql://localhost:3306/floodwatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Schema and demo data come from schema.sql / data.sql (Unit 3 SQL), JPA only validates the mapping
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- FloodWatch business settings ----
# A report becomes CONFIRMED (and is sent to alert-service) when it collects this many CONFIRM votes
floodwatch.confirm-threshold=3
floodwatch.alert-service.url=http://localhost:8082
