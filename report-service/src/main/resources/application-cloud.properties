# Private database and service addresses supplied by the hosting provider.
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:floodwatch}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=120000
floodwatch.alert-service.url=${ALERT_SERVICE_URL}
